<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAMaya Agent V1.2</title>
  <style>
    :root {
      --bg: #0b1020; --panel: rgba(17, 24, 39, 0.7); --panel-2: rgba(30, 41, 59, 0.7);
      --line: rgba(148, 163, 184, 0.25); --txt: #e2e8f0; --sub: #94a3b8;
      --primary: #2563eb; --ok: #16a34a; --warn: #d97706; --err: #dc2626;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans", "Segoe UI", sans-serif; color: var(--txt); background: radial-gradient(circle at 0% 0%, #1d4ed8 0%, #0b1020 45%), #0b1020; min-height: 100vh; }
    .layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; height: 100vh; }
    .card { backdrop-filter: blur(12px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden;}
    .header { padding: 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .title { font-size: 16px; font-weight: 600; }
    button { border: 0; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    .session-list { margin: 0; padding: 10px; list-style: none; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .session-item { padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(15, 23, 42, 0.6); cursor: pointer; }
    .session-item.active { border-color: #60a5fa; background: rgba(37, 99, 235, .25); }
    .session-title { font-size: 14px; }
    .session-time { font-size: 12px; color: var(--sub); }
    .messages { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--panel-2); }
    .bubble { max-width: 85%; border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.6; border: 1px solid var(--line); }
    .bubble.user { align-self: flex-end; background: rgba(37, 99, 235, .25); }
    .bubble.assistant { align-self: flex-start; background: rgba(15, 23, 42, .75); width: 100%; }
    .bubble.tool { align-self: center; max-width: 95%; font-size: 12px; color: #cbd5e1; background: rgba(2, 6, 23, .65); }
    
    /* 修复 3：针对 Think 区块的精美样式 */
    .think-box { margin-bottom: 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
    .think-box summary { padding: 8px 12px; font-size: 13px; color: #a1a1aa; cursor: pointer; user-select: none; font-style: italic; }
    .think-content { padding: 10px 12px; font-size: 13px; color: #94a3b8; border-top: 1px solid rgba(255,255,255,0.05); white-space: pre-wrap; }
    
    .status-area { padding: 8px 14px; font-size: 13px; color: #60a5fa; background: var(--panel); animation: pulse 2s infinite; display: none; }
    @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
    .composer { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px; border-top: 1px solid var(--line); background: var(--panel); }
    .composer textarea { resize: none; min-height: 52px; background: rgba(15, 23, 42, 0.85); color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-family: inherit;}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar card">
      <div class="header"><div class="title">会话列表</div><button id="newSessionBtn">新建</button></div>
      <ul id="sessionList" class="session-list"></ul>
    </aside>
    <section class="main card">
      <div id="messages" class="messages"></div>
      <div id="statusArea" class="status-area"></div>
      <div class="composer">
        <textarea id="input" placeholder="输入指令，例如：检查当前选中的骨骼"></textarea>
        <button id="sendBtn">发送</button>
      </div>
    </section>
  </div>
  <script>
    const sessionListEl = document.getElementById('sessionList');
    const messagesEl = document.getElementById('messages');
    const statusArea = document.getElementById('statusArea');
    const inputEl = document.getElementById('input');
    
    let currentSessionId = null;
    let ws = null;
    let streamingBubble = null;
    let currentStreamText = "";

    function setStatus(text) {
      if(text) { statusArea.style.display = 'block'; statusArea.textContent = text; }
      else { statusArea.style.display = 'none'; }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderMarkdown(text) {
      let html = escapeHtml(text);
      // 动态解析 <think>
      html = html.replace(/&lt;think&gt;/g, '<details class="think-box" open><summary>🧠 思考过程 (点击折叠)</summary><div class="think-content">');
      html = html.replace(/&lt;\/think&gt;/g, '</div></details>');
      // 简单 Markdown 解析
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/## (.*?)\n/g, '<h3 style="color:#60a5fa; margin: 10px 0 5px;">$1</h3>');
      html = html.replace(/### (.*?)\n/g, '<h4 style="margin: 8px 0 4px;">$1</h4>');
      html = html.replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,0.3);padding:2px 4px;border-radius:4px;color:#f87171;">$1</code>');
      return html;
    }

    function addBubble(role, text) {
      const el = document.createElement('div');
      el.className = `bubble ${role}`;
      el.innerHTML = role === 'assistant' ? renderMarkdown(text || '') : escapeHtml(text || '');
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    async function fetchSessions() {
      const resp = await fetch('/api/sessions');
      const sessions = await resp.json();
      sessionListEl.innerHTML = '';
      for (const s of sessions) {
        const li = document.createElement('li');
        li.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
        li.innerHTML = `<div class="session-title">${escapeHtml(s.title || '新会话')}</div><div class="session-time">${new Date(s.created_at).toLocaleString()}</div>`;
        li.onclick = () => switchSession(s.id);
        sessionListEl.appendChild(li);
      }
      if (!currentSessionId && sessions.length) switchSession(sessions[0].id);
    }

    async function createSession() {
      const resp = await fetch('/api/sessions', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title: `会话 ${new Date().toLocaleString()}`}) });
      const session = await resp.json();
      await fetchSessions();
      switchSession(session.id);
    }

    async function switchSession(sessionId) {
      currentSessionId = sessionId;
      const resp = await fetch(`/api/sessions/${sessionId}/messages`);
      const msgs = await resp.json();
      messagesEl.innerHTML = '';
      for (const m of msgs) {
        if (m.role === 'user' || m.role === 'assistant') addBubble(m.role, m.content);
        else addBubble('tool', `[执行工具] ${m.content}`);
      }
      await ensureWsConnected();
      fetchSessions();
    }

    async function ensureWsConnected() {
      if (!currentSessionId) return;
      if (ws) { ws.onclose = null; ws.close(); }
      ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/chat/${currentSessionId}`);
      
      ws.onmessage = (event) => {
        const payload = JSON.parse(event.data);
        if (payload.type === 'status_update') {
          setStatus(payload.content);
        } else if (payload.type === 'stream') {
          setStatus(""); // 有文字输出了就关掉状态条
          if (!streamingBubble) {
            streamingBubble = addBubble('assistant', '');
            currentStreamText = "";
          }
          currentStreamText += (payload.content || '');
          streamingBubble.innerHTML = renderMarkdown(currentStreamText);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (payload.type === 'tool_call') {
          addBubble('tool', `⚙️ 决定调用工具：${payload.name}`);
        } else if (payload.type === 'done') {
          streamingBubble = null;
          setStatus("");
        }
      };
    }

    document.getElementById('sendBtn').onclick = () => {
      const text = inputEl.value.trim();
      if (!text || !ws) return;
      addBubble('user', text);
      streamingBubble = null;
      ws.send(JSON.stringify({ text, use_rag: true }));
      inputEl.value = '';
    };

    document.getElementById('newSessionBtn').onclick = createSession;

    (async function init() {
      await fetchSessions();
      if (!currentSessionId) createSession();
    })();
  </script>
</body>
</html>
