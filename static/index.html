<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAMaya Agent</title>
  <meta name="description" content="DAMaya — Maya Technical Artist AI Assistant" />

  <!-- Highlight.js Theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <!-- App Styles -->
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- ══ Sidebar ══════════════════════════════════════════════ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        DAMaya Agent
      </div>
      <button class="btn-icon" id="newSessionBtn" title="新建会话">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <ul class="session-list" id="sessionList"></ul>

    <div class="sidebar-footer">
      <button class="btn-icon btn-settings" id="settingsBtn" title="设置">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 1 0 4.93 19.07"/><path d="M20.49 9A9 9 0 1 0 7 20.49"/></svg>
        设置
      </button>
    </div>
  </aside>

  <!-- ══ Main ═════════════════════════════════════════════════ -->
  <main class="main">
    <!-- Timeline -->
    <div class="timeline-container" id="timelineContainer">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="w-logo">DAMaya Agent v2.0</div>
        <p>Maya Technical Artist AI 助手</p>
        <p style="font-size:12px;margin-top:4px;">输入指令，开始与 Agent 协作</p>
      </div>
    </div>

    <!-- Status Toast -->
    <div id="statusToast" class="status-toast">
      <div class="spinner"></div>
      <span id="statusText">处理中…</span>
    </div>

    <!-- ── Composer ──────────────────────────────────────────── -->
    <div class="composer-area">

      <!-- Attachment chips -->
      <div class="attachment-chips" id="attachmentChips"></div>

      <!-- Top row: RAG toggle + Model select -->
      <div class="composer-top-row">
        <button class="toggle-pill active" id="ragToggle" title="切换 RAG 上下文增强">
          <span class="toggle-dot"></span>
          <span>RAG</span>
        </button>
        <select class="model-select" id="modelSelect" title="选择模型">
          <!-- Populated by JS -->
        </select>
      </div>

      <div class="composer-wrapper">
        <!-- Left action buttons -->
        <div class="composer-actions">
          <!-- File upload -->
          <button class="composer-file-btn" id="fileBtn" title="上传文件">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <!-- Image upload -->
          <button class="composer-file-btn" id="imageBtn" title="上传图片">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
          <!-- Hidden inputs -->
          <input id="fileInput" type="file" accept=".txt,.md,.json,.pdf,.zip,.py,.mel,.ma" multiple style="display:none">
          <input id="imageInput" type="file" accept="image/*" multiple style="display:none">
        </div>

        <!-- Textarea -->
        <textarea id="msgInput" placeholder="向 Maya Agent 提问… (Shift+Enter 换行)" rows="1"></textarea>

        <!-- Send button -->
        <button id="sendBtn" class="send-btn" title="发送 (Enter)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- ══ Settings Drawer ═══════════════════════════════════════ -->
  <div class="settings-overlay" id="settingsOverlay"></div>
  <div class="settings-drawer" id="settingsDrawer">
    <div class="settings-header">
      <h3>⚙ 设置</h3>
      <button class="btn-icon" id="settingsClose" title="关闭">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="settings-body">

      <div class="settings-section">
        <div class="settings-label">模型</div>
        <select class="settings-select" id="setModelSelect">
          <!-- Populated by JS -->
        </select>
      </div>

      <div class="settings-section">
        <div class="settings-label">功能开关</div>
        <div class="settings-row">
          <span class="settings-row-label">RAG 场景上下文增强</span>
          <label class="toggle-switch">
            <input type="checkbox" id="setRagToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">外观</div>
        <div class="settings-row">
          <span class="settings-row-label">流畅动效</span>
          <label class="toggle-switch">
            <input type="checkbox" id="setAnimToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">关于</div>
        <p style="font-size:12px;color:var(--text-muted);line-height:1.6;">
          DAMaya Agent v2.0<br>
          配置文件：<code style="font-size:11px;color:var(--text-secondary)">settings.json</code><br>
          修改 settings.json 并重启服务器生效。
        </p>
      </div>
    </div>
  </div>

  <!-- ══ Libraries ════════════════════════════════════════════ -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- App Logic -->
  <script src="/static/app.js"></script>

  <script>
    // Hide welcome screen once first message arrives
    const _origStart = TimelineManager.prototype.startNewGroup;
    // Actually handled in app.js; we just hide the screen on first interaction
    document.getElementById('msgInput').addEventListener('keydown', () => {
      const ws = document.getElementById('welcomeScreen');
      if (ws) ws.style.display = 'none';
    }, { once: true });
  </script>
</body>
</html>
