<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAMaya Agent V1.3</title>
  <style>
    :root {
      --bg: #1E1E2E;
      --bg-secondary: #252536;
      --bg-soft: #2b2b40;
      --text: #E0E0E0;
      --text-subtle: #9AA0AA;
      --accent: #2B7DE9;
      --accent-soft: rgba(43, 125, 233, .18);
      --line: rgba(255,255,255,.08);
      --ok: #22C55E;
      --warn: #F59E0B;
      --err: #EF4444;
      --code: #1a1a2e;
      --shadow: 0 2px 14px rgba(0,0,0,.25);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F9F9F9;
        --bg-secondary: #FFFFFF;
        --bg-soft: #F3F4F6;
        --text: #333333;
        --text-subtle: #6b7280;
        --accent: #1A6BD4;
        --accent-soft: rgba(26, 107, 212, .14);
        --line: rgba(0,0,0,.08);
        --ok: #16A34A;
        --warn: #D97706;
        --err: #DC2626;
        --code: #eef1f6;
        --shadow: 0 2px 12px rgba(0,0,0,.08);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    @keyframes slideUpFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blinkDots {
      0%, 80%, 100% { transform: scale(.75); opacity: .35; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { opacity: .65; }
      50% { opacity: 1; }
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      min-width: 260px;
      border-right: 1px solid var(--line);
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .logo { font-weight: 700; font-size: 15px; }
    .logo span { color: var(--accent); }

    .btn {
      border: 0;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 7px 12px;
      cursor: pointer;
      transition: all .2s ease;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }

    .session-list {
      margin: 0;
      padding: 8px;
      list-style: none;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .session-item {
      padding: 10px 10px 10px 12px;
      border-radius: 10px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all .2s ease;
    }

    .session-item:hover { background: var(--accent-soft); }

    .session-item.active {
      background: var(--accent-soft);
      border-left-color: var(--accent);
    }

    .session-title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-time {
      font-size: 11px;
      color: var(--text-subtle);
      margin-top: 4px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .messages {
      flex: 1;
      overflow: auto;
      scroll-behavior: smooth;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .animate-in { animation: slideUpFadeIn .3s ease-out both; }

    .bubble {
      max-width: 75%;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow);
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--accent-soft);
      border-color: rgba(43, 125, 233, .35);
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--bg-secondary);
    }

    .bubble.error {
      align-self: center;
      max-width: 90%;
      background: rgba(239, 68, 68, .08);
      border-color: rgba(239, 68, 68, .35);
      color: var(--err);
    }

    .agent-trace-card {
      align-self: flex-start;
      width: min(860px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--bg-secondary);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .trace-header {
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text-subtle);
      border-bottom: 1px solid var(--line);
      background: var(--bg-soft);
    }

    .trace-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
    }

    .trace-step {
      border: 1px solid var(--line);
      background: var(--bg-soft);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      transition: all .3s ease;
    }

    .trace-step summary {
      cursor: pointer;
      user-select: none;
      transition: all .2s ease;
    }

    .trace-step summary:hover { color: var(--accent); }

    .trace-step pre {
      margin: 8px 0 0;
      border-radius: 8px;
      padding: 9px;
      font-size: 12px;
      background: var(--code);
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: "JetBrains Mono", "Consolas", monospace;
    }

    .trace-final {
      margin: 0 12px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg-secondary);
      padding: 12px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
      transition: all .3s ease;
    }

    .trace-final.visible { display: block; }

    .think-box {
      margin: 0 0 10px;
      border: 1px solid var(--line);
      border-left: 3px solid rgba(128, 128, 128, .6);
      border-radius: 10px;
      background: color-mix(in oklab, var(--bg-soft) 92%, #000 8%);
      transition: all .3s ease;
    }

    .think-box summary {
      cursor: pointer;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text-subtle);
      user-select: none;
      transition: all .2s ease;
    }

    .think-box summary:hover {
      color: var(--accent);
    }

    .think-content {
      border-top: 1px dashed var(--line);
      margin: 0 10px 10px;
      padding: 8px 0 0 10px;
      border-left: 2px solid rgba(128, 128, 128, .45);
      color: var(--text-subtle);
      font-style: italic;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .skeleton {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 2px;
      transition: all .3s ease;
    }

    .skeleton-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--text-subtle);
      animation: blinkDots 1.2s infinite;
    }

    .skeleton-dot:nth-child(2) { animation-delay: .18s; }
    .skeleton-dot:nth-child(3) { animation-delay: .36s; }

    .composer-wrap {
      border-top: 1px solid var(--line);
      background: var(--bg-secondary);
      padding: 10px 16px 14px;
    }

    .agent-status-area {
      display: none;
      align-items: center;
      gap: 8px;
      min-height: 24px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--text-subtle);
      transition: all .3s ease;
    }

    .agent-status-area.show { display: flex; }

    .agent-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
      animation: breathe 1.2s ease-in-out infinite;
    }

    .composer {
      border: 1px solid var(--line);
      background: var(--bg-soft);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: all .2s ease;
    }

    .composer:focus-within {
      border-color: rgba(43,125,233,.45);
      box-shadow: 0 0 0 2px rgba(43,125,233,.12);
    }

    .composer textarea {
      flex: 1;
      min-height: 24px;
      max-height: 170px;
      resize: none;
      overflow: hidden;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      line-height: 1.5;
    }

    .send {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s ease;
    }

    .send:hover { transform: scale(1.04); filter: brightness(1.06); }

    @media (max-width: 780px) {
      .sidebar { display: none; }
      .bubble { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">DA<span>Maya</span></div>
        <button id="newSessionBtn" class="btn">+ 新会话</button>
      </div>
      <ul id="sessionList" class="session-list"></ul>
    </aside>

    <main class="main">
      <div id="messages" class="messages"></div>

      <div class="composer-wrap">
        <div id="agentStatusArea" class="agent-status-area">
          <span class="agent-status-dot"></span>
          <span id="agentStatusText">✨ Agent 正在处理中...</span>
        </div>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="输入指令，例如：帮我查询当前选择对象"></textarea>
          <button id="sendBtn" class="send" title="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const sessionListEl = document.getElementById('sessionList');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const newSessionBtn = document.getElementById('newSessionBtn');
    const agentStatusArea = document.getElementById('agentStatusArea');
    const agentStatusText = document.getElementById('agentStatusText');

    let currentSessionId = null;
    let ws = null;
    let currentTrace = null;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text ?? '';
      return div.innerHTML;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    function autoResizeInput() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 170) + 'px';
      inputEl.style.overflowY = inputEl.scrollHeight > 170 ? 'auto' : 'hidden';
    }

    function showAgentStatus(text) {
      agentStatusText.textContent = `✨ Agent ${text}`;
      agentStatusArea.classList.add('show');
    }

    function hideAgentStatus() {
      agentStatusArea.classList.remove('show');
    }

    function addBubble(role, text) {
      const el = document.createElement('div');
      el.className = `bubble ${role} animate-in`;
      el.innerHTML = escapeHtml(text);
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function createTraceCard() {
      const card = document.createElement('div');
      card.className = 'agent-trace-card animate-in';
      card.innerHTML = `
        <div class="trace-header">Agent 执行链</div>
        <div class="trace-steps"></div>
        <div class="trace-final"></div>
      `;

      const stepsEl = card.querySelector('.trace-steps');
      const finalEl = card.querySelector('.trace-final');

      const skeleton = document.createElement('div');
      skeleton.className = 'skeleton';
      skeleton.innerHTML = '<span class="skeleton-dot"></span><span class="skeleton-dot"></span><span class="skeleton-dot"></span>';
      stepsEl.appendChild(skeleton);

      messagesEl.appendChild(card);
      scrollToBottom();

      const finalTextNode = document.createTextNode('');
      finalEl.appendChild(finalTextNode);

      currentTrace = {
        card,
        stepsEl,
        finalEl,
        finalTextNode,
        skeleton,
        stepIndex: 0,
        hasStream: false,
        streamBuffer: '',
        inThink: false,
        thinkDetails: null,
        thinkContentEl: null,
      };
      return currentTrace;
    }

    function clearSkeletonIfNeeded() {
      if (!currentTrace || !currentTrace.skeleton) return;
      currentTrace.skeleton.remove();
      currentTrace.skeleton = null;
    }

    function appendTraceStepSummary(text) {
      if (!currentTrace) return;
      currentTrace.stepIndex += 1;
      const item = document.createElement('div');
      item.className = 'trace-step animate-in';
      item.innerHTML = `<div>[步骤 ${currentTrace.stepIndex}] ${escapeHtml(text)}</div>`;
      currentTrace.stepsEl.appendChild(item);
      scrollToBottom();
    }

    function appendTraceStepDetails(summary, detailsText) {
      if (!currentTrace) return;
      currentTrace.stepIndex += 1;
      const details = document.createElement('details');
      details.className = 'trace-step animate-in';
      details.innerHTML = `
        <summary>[步骤 ${currentTrace.stepIndex}] ${escapeHtml(summary)}</summary>
        <pre><code>${escapeHtml(detailsText)}</code></pre>
      `;
      currentTrace.stepsEl.appendChild(details);
      scrollToBottom();
    }

    function ensureThinkBox() {
      if (!currentTrace) return;
      if (currentTrace.thinkDetails && currentTrace.thinkContentEl) return;

      const details = document.createElement('details');
      details.className = 'think-box';
      const summary = document.createElement('summary');
      summary.textContent = '🧠 思考过程 (点击展开)';
      const content = document.createElement('div');
      content.className = 'think-content';

      details.appendChild(summary);
      details.appendChild(content);
      currentTrace.finalEl.appendChild(details);
      currentTrace.thinkDetails = details;
      currentTrace.thinkContentEl = content;
    }

    function appendOutsideText(text) {
      if (!currentTrace || !text) return;
      currentTrace.finalTextNode.data += text;
    }

    function appendThinkText(text) {
      if (!currentTrace || !text) return;
      ensureThinkBox();
      currentTrace.thinkContentEl.textContent += text;
    }

    function consumeStreamBuffer(finalFlush = false) {
      if (!currentTrace) return;
      const openTag = '<think>';
      const closeTag = '</think>';

      while (true) {
        if (!currentTrace.inThink) {
          const openIdx = currentTrace.streamBuffer.indexOf(openTag);
          if (openIdx === -1) {
            if (finalFlush) {
              appendOutsideText(currentTrace.streamBuffer);
              currentTrace.streamBuffer = '';
            } else {
              const keep = openTag.length - 1;
              if (currentTrace.streamBuffer.length > keep) {
                appendOutsideText(currentTrace.streamBuffer.slice(0, -keep));
                currentTrace.streamBuffer = currentTrace.streamBuffer.slice(-keep);
              }
            }
            return;
          }

          appendOutsideText(currentTrace.streamBuffer.slice(0, openIdx));
          currentTrace.streamBuffer = currentTrace.streamBuffer.slice(openIdx + openTag.length);
          currentTrace.inThink = true;
          ensureThinkBox();
          continue;
        }

        const closeIdx = currentTrace.streamBuffer.indexOf(closeTag);
        if (closeIdx === -1) {
          if (finalFlush) {
            appendThinkText(currentTrace.streamBuffer);
            currentTrace.streamBuffer = '';
            currentTrace.inThink = false;
          } else {
            const keep = closeTag.length - 1;
            if (currentTrace.streamBuffer.length > keep) {
              appendThinkText(currentTrace.streamBuffer.slice(0, -keep));
              currentTrace.streamBuffer = currentTrace.streamBuffer.slice(-keep);
            }
          }
          return;
        }

        appendThinkText(currentTrace.streamBuffer.slice(0, closeIdx));
        currentTrace.streamBuffer = currentTrace.streamBuffer.slice(closeIdx + closeTag.length);
        currentTrace.inThink = false;
      }
    }

    function appendTraceStream(textChunk) {
      if (!currentTrace) return;
      clearSkeletonIfNeeded();
      currentTrace.hasStream = true;
      currentTrace.finalEl.classList.add('visible');
      currentTrace.streamBuffer += (textChunk || '');
      consumeStreamBuffer(false);
      scrollToBottom();
    }

    function finalizeTraceStreamBuffer() {
      if (!currentTrace) return;
      consumeStreamBuffer(true);
    }

    function showApprovalCard(payload) {
      if (!currentTrace) return;
      currentTrace.stepIndex += 1;
      const item = document.createElement('div');
      item.className = 'trace-step animate-in';
      item.innerHTML = `
        <div><strong>[步骤 ${currentTrace.stepIndex}] ⚠️ 高危操作审批：${escapeHtml(payload.name || '')}</strong></div>
        <pre><code>${escapeHtml(payload.preview || '')}</code></pre>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn" data-a="1" style="flex:1; background: var(--ok);">批准执行</button>
          <button class="btn" data-a="0" style="flex:1; background: var(--err);">拒绝</button>
        </div>
      `;
      currentTrace.stepsEl.appendChild(item);
      scrollToBottom();

      item.querySelectorAll('button[data-a]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const approved = btn.dataset.a === '1';
          item.querySelectorAll('button').forEach((b) => {
            b.disabled = true;
            b.style.opacity = (b === btn) ? '1' : '0.35';
          });
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'approval_response', approved }));
          }
        });
      });
    }

    async function fetchSessions() {
      const resp = await fetch('/api/sessions');
      const sessions = await resp.json();
      renderSessions(sessions);
      if (!currentSessionId && sessions.length) {
        await switchSession(sessions[0].id);
      }
    }

    function renderSessions(sessions) {
      sessionListEl.innerHTML = '';
      for (const s of sessions) {
        const li = document.createElement('li');
        li.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
        li.innerHTML = `
          <div class="session-title">${escapeHtml(s.title || '新会话')}</div>
          <div class="session-time">${new Date(s.created_at).toLocaleString()}</div>
        `;
        li.onclick = () => switchSession(s.id);
        sessionListEl.appendChild(li);
      }
    }

    async function createSession() {
      const title = `会话 ${new Date().toLocaleString()}`;
      const resp = await fetch('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      const session = await resp.json();
      await fetchSessions();
      await switchSession(session.id);
    }

    async function switchSession(sessionId) {
      if (!sessionId) return;
      currentSessionId = sessionId;
      hideAgentStatus();
      currentTrace = null;
      await fetchMessages(sessionId);
      await ensureWsConnected();
      await fetchSessions();
    }

    async function fetchMessages(sessionId) {
      const resp = await fetch(`/api/sessions/${sessionId}/messages`);
      const msgs = await resp.json();
      messagesEl.innerHTML = '';
      for (const m of msgs) {
        if (m.role === 'user' || m.role === 'assistant') {
          addBubble(m.role, m.content || '');
        } else if (m.role === 'tool') {
          appendHistoricalTool(m.content || '');
        }
      }
      scrollToBottom();
    }

    function appendHistoricalTool(content) {
      const details = document.createElement('details');
      details.className = 'trace-step animate-in';
      details.innerHTML = `
        <summary>📋 历史工具记录</summary>
        <pre><code>${escapeHtml(content)}</code></pre>
      `;
      const wrap = document.createElement('div');
      wrap.className = 'agent-trace-card animate-in';
      wrap.innerHTML = '<div class="trace-header">历史执行链片段</div><div class="trace-steps"></div>';
      wrap.querySelector('.trace-steps').appendChild(details);
      messagesEl.appendChild(wrap);
    }

    async function ensureWsConnected() {
      if (!currentSessionId) return;
      if (ws) {
        ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null;
        ws.close();
      }

      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${protocol}://${location.host}/ws/chat/${currentSessionId}`);

      ws.onmessage = (event) => {
        const payload = JSON.parse(event.data);

        if (payload.type === 'status_update') {
          clearSkeletonIfNeeded();
          showAgentStatus(payload.content || '正在处理...');
          return;
        }

        if (payload.type === 'stream') {
          appendTraceStream(payload.content || '');
          return;
        }

        if (payload.type === 'tool_call') {
          clearSkeletonIfNeeded();
          appendTraceStepDetails(
            `🧠 思考并决定调用工具 ${payload.name || ''}`,
            JSON.stringify(payload.arguments ?? {}, null, 2)
          );
          return;
        }

        if (payload.type === 'tool_result') {
          clearSkeletonIfNeeded();
          appendTraceStepDetails(
            `✅ 工具 ${payload.name || ''} 执行完成（点击展开详情）`,
            JSON.stringify(payload.result ?? {}, null, 2)
          );
          return;
        }

        if (payload.type === 'approval_required') {
          clearSkeletonIfNeeded();
          showApprovalCard(payload);
          return;
        }

        if (payload.type === 'error') {
          clearSkeletonIfNeeded();
          addBubble('error', payload.message || '未知错误');
          hideAgentStatus();
          return;
        }

        if (payload.type === 'done') {
          clearSkeletonIfNeeded();
          finalizeTraceStreamBuffer();
          hideAgentStatus();
          currentTrace = null;
        }
      };
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        addBubble('error', 'WebSocket 未连接，请先选择会话');
        return;
      }

      addBubble('user', text);
      createTraceCard();
      showAgentStatus('正在接管任务...');

      ws.send(JSON.stringify({ text, use_rag: true }));
      inputEl.value = '';
      autoResizeInput();
    }

    inputEl.addEventListener('input', autoResizeInput);
    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    newSessionBtn.addEventListener('click', createSession);

    (async function init() {
      await fetchSessions();
      if (!currentSessionId) {
        await createSession();
      }
      hideAgentStatus();
    })();
